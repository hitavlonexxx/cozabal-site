<!-- @dsCard group="Colors" viewport="700x170" name="Ground pairings" subtitle="Text and accent on ink vs on bone" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:170px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div class="row" style="gap:14px;align-items:stretch">
  <div style="flex:1;background:var(--ink-800);border-radius:var(--radius-sm);padding:18px 20px">
    <div style="font-family:var(--font-sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-600)">Eyebrow</div>
    <div style="font-family:var(--font-display);font-size:26px;color:var(--bone-100);margin-top:6px">Timeless Spaces</div>
    <div style="font-size:12px;color:var(--grey-300);margin-top:6px;font-weight:300">Body copy on ink, grey 300.</div>
  </div>
  <div style="flex:1;background:var(--bone-100);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);padding:18px 20px">
    <div style="font-family:var(--font-sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-600)">Eyebrow</div>
    <div style="font-family:var(--font-display);font-size:26px;color:var(--ink-900);margin-top:6px">Timeless Spaces</div>
    <div style="font-size:12px;color:var(--text-body);margin-top:6px;font-weight:300">Body copy on bone, grey 500.</div>
  </div></div></body></html>
