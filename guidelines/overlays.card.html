<!-- @dsCard group="Brand" viewport="700x180" name="Image overlays" subtitle="Protection gradients over photography" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:180px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div class="row" style="gap:14px;height:100%">
  <div style="flex:1;position:relative;border-radius:var(--radius-sm);background:linear-gradient(150deg,var(--ink-600),var(--ink-900))">
    <div style="position:absolute;inset:0;background:var(--overlay-image);border-radius:var(--radius-sm)"></div>
    <div style="position:absolute;left:16px;bottom:14px;font-family:var(--font-display);font-size:18px;color:var(--bone-100)">overlay-image</div></div>
  <div style="flex:1;position:relative;border-radius:var(--radius-sm);background:linear-gradient(150deg,var(--ink-500),var(--ink-900))">
    <div style="position:absolute;inset:0;background:var(--overlay-hero);border-radius:var(--radius-sm)"></div>
    <div style="position:absolute;left:16px;bottom:14px;font-family:var(--font-display);font-size:18px;color:var(--bone-100)">overlay-hero</div></div>
  </div></body></html>
