<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Slow, eased, no bounce" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:150px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div style="width:100%;display:flex;gap:30px;font-size:12px;color:var(--text-body)">
  <div><div class="lb">durations</div><div style="margin-top:8px;line-height:1.9">fast 140ms<br>base 240ms<br>slow 420ms<br>image 700ms</div></div>
  <div><div class="lb">easing</div><div style="margin-top:8px;line-height:1.9;font-family:var(--font-mono);font-size:11px">cubic-bezier(.22,.61,.36,1)<br>cubic-bezier(.16,.84,.44,1)</div></div>
  <div><div class="lb">gestures</div><div style="margin-top:8px;line-height:1.9">card lift &minus;2px<br>arrow slide +3px<br>press scale .985<br>image zoom 1.04</div></div>
  </div></body></html>
