<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="Two shadows only: card and float" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:170px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div class="row" style="gap:20px;align-items:center;height:100%">
  <div style="flex:1;height:88px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">shadow-card</div>
  <div style="flex:1;height:88px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-card-hover);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">card-hover</div>
  <div style="flex:1;height:88px;background:var(--glass-ink);backdrop-filter:blur(14px);border:1px solid var(--border-hairline-ink);border-radius:var(--radius-xl);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-200)">shadow-float</div>
  </div></body></html>
