<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:150px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bone-050)"></div><div class="lb">bone 050</div><div class="hx">#FDFBF7</div></div><div class="sw"><div class="chip" style="background:var(--bone-100)"></div><div class="lb">bone 100</div><div class="hx">#F8F5EE</div></div><div class="sw"><div class="chip" style="background:var(--bone-200)"></div><div class="lb">bone 200</div><div class="hx">#F2EDE3</div></div><div class="sw"><div class="chip" style="background:var(--bone-300)"></div><div class="lb">bone 300</div><div class="hx">#E7E0D2</div></div><div class="sw"><div class="chip" style="background:var(--bone-400)"></div><div class="lb">bone 400</div><div class="hx">#D8CFBD</div></div></div></body></html>
