    <div style="flex:1;border:1px solid var(--border-hairline);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">container 1180 · section-y 96</div>

  </div>
