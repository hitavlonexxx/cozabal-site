<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Muted, earth-shifted status colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{width:700px;height:150px;box-sizing:border-box;font-family:var(--font-sans);background:var(--surface-page);display:flex;align-items:center;padding:22px 26px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}.hx{font-size:10px;color:var(--grey-400);font-variant-numeric:tabular-nums}.row{display:flex;gap:10px;width:100%}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="lb">success</div><div class="hx">#6E8B5B</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="lb">warning</div><div class="hx">#C08F4E</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="lb">danger</div><div class="hx">#A2493C</div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="lb">info</div><div class="hx">#5E7284</div></div></div></body></html>
